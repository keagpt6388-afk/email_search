[project]
name = "email-search"
version = "0.1.0"
description = "소속·이름·기술분야로 신뢰할 수 있는 공개 출처(OpenAlex·ORCID·Europe PMC·bioRxiv·ROR·Wikidata·OpenDART·OA 전문)에서 연구자·발명자의 공개 이메일을 찾는 도구"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
email-search = "email_search.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
